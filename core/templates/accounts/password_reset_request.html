{% extends 'website/base.html' %}

{% block title %}
بازیابی گذرواژه
{% endblock title %}

{% block content %}
<div class="container content-space-3 content-space-t-lg-4 content-space-b-lg-3">
  <div class="flex-grow-1 mx-auto" style="max-width: 28rem;">
    <div class="text-center mb-5 mb-md-7">
      <h1 class="h2">رمز عبور را فراموش کرده اید؟</h1>
      <p>آدرس ایمیل خود را در فیلد زیر وارد کنید.</p>
    </div>

    <form method="post" action="{% url 'accounts:password_reset' %}">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label" for="email">ایمیل شما</label>
        <input type="email" class="form-control form-control-lg text-center" name="email" id="email"
          placeholder="email@site.com" aria-label="email@site.com" required>
        <span class="invalid-feedback">لطفا یک آدرس ایمیل معتبر وارد کنید.</span>
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary btn-lg">ارسال لینک بازیابی</button>
      </div>

      <div class="text-center">
        <a class="link" href="{% url 'accounts:login' %}">بازگشت به صفحه ورود</a>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
